name: Frontend CI

on:
  push:
    branches: [master, main, develop]
    paths:
      - 'frontend/**'
  pull_request:
    branches: [master, main, develop]
    paths:
      - 'frontend/**'

jobs:
  # ─────────────────────────────────────────────
  # 1. Build check
  # ─────────────────────────────────────────────
  build:
    name: Vite Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          # Variables de entorno mínimas para que Vite compile sin errores
          VITE_WALLETCONNECT_PROJECT_ID: ${{ secrets.VITE_WALLETCONNECT_PROJECT_ID }}
          VITE_SEPOLIA_RPC_URL: ${{ secrets.VITE_SEPOLIA_RPC_URL || 'https://rpc.sepolia.org' }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ─────────────────────────────────────────────
  # 2. Lint (ESLint) — corre en paralelo con build
  # ─────────────────────────────────────────────
  lint:
    name: ESLint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        run: npm install

      # Si aún no tenés ESLint config, este step falla silenciosamente
      - name: Run ESLint
        run: npx eslint src/ --ext .js,.jsx --max-warnings 0 || echo "::warning::ESLint no configurado — agregá .eslintrc.json"
        continue-on-error: true
