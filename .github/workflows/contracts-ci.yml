name: Contracts CI

on:
  push:
    branches: [master, main, develop]
    paths:
      - 'contracts/**'
      - 'test/**'
      - 'scripts/**'
      - 'hardhat.config.js'
      - 'package.json'
  pull_request:
    branches: [master, main, develop]
    paths:
      - 'contracts/**'
      - 'test/**'
      - 'scripts/**'
      - 'hardhat.config.js'
      - 'package.json'

jobs:
  # ─────────────────────────────────────────────
  # 1. Compile + Test (Hardhat local network)
  # ─────────────────────────────────────────────
  test:
    name: Compile & Test Contracts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts
        run: npm run compile

      - name: Run tests
        run: npm test
        env:
          # No RPC key needed — runs on Hardhat local node
          REPORT_GAS: true

      - name: Upload artifacts (ABIs)
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: contract-artifacts
          path: artifacts/
          retention-days: 7

  # ─────────────────────────────────────────────
  # 2. Coverage report
  # ─────────────────────────────────────────────
  coverage:
    name: Solidity Coverage
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run coverage
        run: npm run coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  # ─────────────────────────────────────────────
  # 3. Static analysis with Slither (security)
  # ─────────────────────────────────────────────
  slither:
    name: Slither Static Analysis
    runs-on: ubuntu-latest
    needs: test
    continue-on-error: true   # No bloquea el merge mientras ajustamos findings

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts (needed for Slither)
        run: npm run compile

      - name: Run Slither
        uses: crytic/slither-action@v0.4.0
        with:
          target: 'contracts/'
          slither-args: '--exclude-dependencies'
          sarif: results.sarif
          fail-on: high

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: results.sarif
